[package]
name = "quvyta"
version = "0.3.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Installs, opens and updates the terminal applications of the Quvyta ecosystem (beta)"
repository = "https://github.com/quvyta/quvyta"
readme = "README.md"
keywords = ["tui", "terminal", "quvyta"]
categories = ["command-line-utilities"]
# The paths are anchored with a leading slash: an unanchored "README.md" would also
# match README files further down the tree, such as the one in packaging/.
include = ["/src/**", "/assets/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[dependencies]
quvyta-framework = "0.1.29"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
cast_lossless = "deny"
needless_pass_by_value = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
uninlined_format_args = "deny"
