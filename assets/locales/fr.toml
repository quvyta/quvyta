[apps.code]
title = "Quvyta Code"
summary = "Fait tourner des agents de code dans des conteneurs Podman ou Docker. Vous réglez un profil une fois, vous l’ouvrez dans n’importe lequel de vos projets et vous passez d’un agent ou d’un shell à l’autre comme entre des onglets."

[apps.focus]
title = "Quvyta Focus"
summary = "Le suivi du temps dans le terminal. Lancez un compteur sur ce que vous faites et voyez où votre temps est passé, en graphiques du jour, de la semaine, du mois et de l’année."

[apps.tools]
title = "Quvyta Tools"
summary = "Applique depuis une seule liste les réglages que les utilisateurs d’Arch Linux font d’habitude à la main : miroirs, pacman, un assistant AUR, un pare-feu, SSH et le reste. Chaque point montre ce qu’il va toucher, garde une sauvegarde et se défait."

[apps.packages]
title = "Quvyta Packages"
summary = "Un gestionnaire de paquets pour Arch Linux qui montre exactement ce qui va changer avant que quoi que ce soit ne change. Cette première version gère les paquets de pacman ; AUR, Flatpak et Snap sont reconnus mais pas encore gérés."

[apps.desk]
title = "Quvyta Desktop"
summary = "Un bureau qui tourne dans le terminal : des fenêtres, un dock, un lanceur et un gestionnaire de fichiers, pensés pour travailler en SSH et sur de petites machines. Tapez qdesk sur un serveur et ouvrez vos programmes côte à côte à la souris, sans apprendre le moindre raccourci."

[apps.framework]
title = "Quvyta Framework"
summary = "La vitrine du framework : tous les composants, thèmes, jeux d’icônes et langues des applications Quvyta, à essayer en direct."
library = "Le framework lui-même est une bibliothèque Rust : le moteur, les composants et les fichiers de thème, d’icônes et de langue sur lesquels repose chaque application Quvyta. Chacun peut s’en servir pour écrire ses propres applications en terminal."

[apps.quvyta]
title = "Quvyta"
summary = "Cette application : elle liste les applications Quvyta, les installe, les ouvre, les tient à jour et les supprime."

