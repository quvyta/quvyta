[apps.code]
title = "Quvyta Code"
summary = "Roda agentes de programação dentro de contêineres do Podman ou do Docker. Você monta um perfil uma vez, abre ele em qualquer projeto seu e troca entre agentes e shells como quem troca de aba."

[apps.focus]
title = "Quvyta Focus"
summary = "Acompanhamento do tempo no terminal. Você liga um contador no que está fazendo e vê para onde foi o seu tempo em gráficos de dia, semana, mês e ano."

[apps.tools]
title = "Quvyta Tools"
summary = "Aplica de uma lista só os ajustes que quem usa Arch Linux costuma fazer na mão: espelhos, pacman, um ajudante do AUR, um firewall, SSH e mais. Cada item mostra no que vai mexer, guarda uma cópia e pode ser desfeito."

[apps.packages]
title = "Quvyta Packages"
summary = "Um gerenciador de pacotes para Arch Linux que mostra exatamente o que vai mudar antes de mudar qualquer coisa. Esta primeira versão cuida dos pacotes do pacman; AUR, Flatpak e Snap são reconhecidos, mas ainda não são gerenciados."

[apps.desk]
title = "Quvyta Desktop"
summary = "Uma área de trabalho que roda dentro do terminal: janelas, uma dock, um lançador e um gerenciador de arquivos, feita para trabalhar por SSH e em máquinas pequenas. Você digita qdesk num servidor e abre programas lado a lado com o mouse, sem decorar um único atalho."

[apps.framework]
title = "Quvyta Framework"
summary = "A vitrine do framework: todos os componentes, temas, conjuntos de ícones e idiomas dos aplicativos Quvyta, para experimentar ao vivo."
library = "O framework em si é uma biblioteca Rust: o motor, os componentes e os arquivos de tema, ícones e idioma sobre os quais cada aplicativo Quvyta é construído. Qualquer um pode usá-la para fazer seus próprios aplicativos de terminal."

[apps.quvyta]
title = "Quvyta"
summary = "Este aplicativo: lista os aplicativos Quvyta, instala, abre, mantém eles em dia e remove eles."

