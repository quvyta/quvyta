[family.code]
title = "Quvyta Code"
summary = "コーディングエージェントを Podman や Docker のコンテナの中で動かします。プロファイルを一度作れば、どのプロジェクトでも開けて、エージェントとシェルをタブのように行き来できます。"

[family.focus]
title = "Quvyta Focus"
summary = "ターミナルでの集中時間の記録。取りかかっていることにカウンターを回し、日・週・月・年のグラフで時間の行き先を見ます。"

[family.tools]
title = "Quvyta Tools"
summary = "Arch Linux で手作業になりがちな設定を一つのリストから当てます。ミラー、pacman、AUR ヘルパー、ファイアウォール、SSH など。どの項目も何に触れるかを先に示し、バックアップを取り、あとから元に戻せます。"

[family.packages]
title = "Quvyta Packages"
summary = "何かが変わる前に、何がどう変わるかをそのまま見せる Arch Linux 向けのパッケージマネージャーです。この最初の版は pacman のパッケージを扱います。AUR、Flatpak、Snap は認識しますが、まだ管理はしません。"

[family.desk]
title = "Quvyta Desktop"
summary = "ターミナルの中で動くデスクトップです。ウィンドウ、ドック、ランチャー、ファイルマネージャーがそろい、SSH 越しの作業や非力なマシンのために作られています。サーバーで qdesk と打てば、ショートカットを一つも覚えずにマウスで並べて使えます。"

[family.framework]
title = "Quvyta Framework"
summary = "フレームワークのショーケース。この一家のウィジェット、テーマ、アイコン、言語をその場で試せます。"
library = "フレームワーク自体は Rust のライブラリです。すべての Quvyta アプリが乗っているランタイム、ウィジェット、テーマ・アイコン・言語ファイルが入っています。誰でもこれで自分のターミナルアプリを作れます。"

[family.quvyta]
title = "Quvyta"
summary = "このアプリです。一家を一覧にして、入れて、開いて、最新に保ち、削除します。"

