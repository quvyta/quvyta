[family.framework]
tab = "Framework"
title = "Quvyta Framework"
summary = "Bütün Quvyta uygulamalarının üzerinde durduğu Rust framework'ü: çalışma zamanı, bileşenler, tema, ikon ve dil dosyaları. Herkes kendi terminal uygulamasını onunla yazabilir."

[family.code]
tab = "qcode"
title = "Quvyta Code"
summary = "Kodlama ajanı harness'larını Podman ya da Docker kapsayıcılarında çalıştırır. Bir profili bir kez kurarsın, sonra onu istediğin projede açar, harness'lar ve kabuklar arasında sekme gibi geçersin."

[family.focus]
tab = "qfocus"
title = "Quvyta Focus"
summary = "Terminalde odak takibi. Üzerinde çalıştığın şeye bir sayaç başlatırsın, zamanının nereye gittiğini gün, hafta, ay ve yıl grafikleriyle görürsün."

[family.tools]
tab = "qtools"
title = "Quvyta Tools"
summary = "Arch Linux kullanıcılarının genelde elle yaptığı ayarları tek bir listeden uygular: yansılar, pacman, bir AUR yardımcısı, güvenlik duvarı, SSH ve fazlası. Her madde neye dokunacağını gösterir, yedek alır ve geri alınabilir."

[family.packages]
tab = "qpackages"
title = "Quvyta Packages"
summary = "Arch Linux için, bir şey değişmeden önce neyin değişeceğini tam olarak gösteren bir paket yöneticisi. Bu ilk sürüm pacman paketlerini yönetir; AUR, Flatpak ve Snap tanınır ama henüz yönetilmez."
