[family.code]
title = "Quvyta Code"
summary = "Kodlama ajanı harness'larını Podman ya da Docker kapsayıcılarında çalıştırır. Bir profili bir kez kurarsın, sonra onu istediğin projede açar, harness'lar ve kabuklar arasında sekme gibi geçersin."

[family.focus]
title = "Quvyta Focus"
summary = "Terminalde odak takibi. Üzerinde çalıştığın şeye bir sayaç başlatırsın, zamanının nereye gittiğini gün, hafta, ay ve yıl grafikleriyle görürsün."

[family.tools]
title = "Quvyta Tools"
summary = "Arch Linux kullanıcılarının genelde elle yaptığı ayarları tek bir listeden uygular: yansılar, pacman, bir AUR yardımcısı, güvenlik duvarı, SSH ve fazlası. Her madde neye dokunacağını gösterir, yedek alır ve geri alınabilir."

[family.packages]
title = "Quvyta Packages"
summary = "Arch Linux için, bir şey değişmeden önce neyin değişeceğini tam olarak gösteren bir paket yöneticisi. Bu ilk sürüm pacman paketlerini yönetir; AUR, Flatpak ve Snap tanınır ama henüz yönetilmez."

[family.desk]
title = "Quvyta Desktop"
summary = "Terminalin içinde çalışan bir masaüstü: pencereler, bir dock, bir başlatıcı ve bir dosya yöneticisi; SSH üzerinden çalışmak ve küçük makineler için yapıldı. Bir sunucuda qdesk yazarsın, programları tek bir kısayol ezberlemeden fareyle yan yana açarsın."

[family.framework]
title = "Quvyta Framework"
summary = "Framework'ün vitrini: ailenin bütün bileşenleri, temaları, ikon setleri ve dilleri, canlı olarak denemek için."
library = "Framework'ün kendisi bir Rust kütüphanesi: bütün Quvyta uygulamalarının üzerinde durduğu çalışma zamanı, bileşenler, tema, ikon ve dil dosyaları. Herkes kendi terminal uygulamasını onunla yazabilir."

[family.quvyta]
title = "Quvyta"
summary = "Bu uygulama: aileyi listeler, üyelerini kurar, açar, güncel tutar ve kaldırır."

