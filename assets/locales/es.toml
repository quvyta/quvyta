[apps.code]
title = "Quvyta Code"
summary = "Ejecuta agentes de programación dentro de contenedores de Podman o Docker. Configuras un perfil una vez, lo abres en cualquiera de tus proyectos y te mueves entre agentes y shells como entre pestañas."

[apps.focus]
title = "Quvyta Focus"
summary = "Seguimiento del tiempo en la terminal. Pon un contador en marcha sobre lo que estás haciendo y mira adónde se fue tu tiempo en gráficas de día, semana, mes y año."

[apps.tools]
title = "Quvyta Tools"
summary = "Aplica desde una sola lista los ajustes que los usuarios de Arch Linux suelen hacer a mano: réplicas, pacman, un asistente de AUR, un cortafuegos, SSH y más. Cada punto muestra qué va a tocar, guarda una copia y se puede deshacer."

[apps.packages]
title = "Quvyta Packages"
summary = "Un gestor de paquetes para Arch Linux que muestra exactamente qué va a cambiar antes de que cambie nada. Esta primera versión gestiona los paquetes de pacman; AUR, Flatpak y Snap se reconocen, pero todavía no se gestionan."

[apps.desk]
title = "Quvyta Desktop"
summary = "Un escritorio que funciona dentro de la terminal: ventanas, un dock, un lanzador y un gestor de archivos, hecho para trabajar por SSH y en máquinas pequeñas. Escribes qdesk en un servidor y abres programas uno al lado del otro con el ratón, sin aprender ni un solo atajo."

[apps.framework]
title = "Quvyta Framework"
summary = "El escaparate del framework: todos los componentes, temas, juegos de iconos e idiomas con los que se hacen las aplicaciones de Quvyta, para probarlos en vivo."
library = "El framework en sí es una biblioteca de Rust: el motor, los componentes y los archivos de tema, iconos e idioma sobre los que se apoya cada aplicación de Quvyta. Cualquiera puede usarla para hacer sus propias aplicaciones de terminal."

[apps.quvyta]
title = "Quvyta"
summary = "Esta aplicación: lista las aplicaciones de Quvyta, las instala, las abre, las mantiene al día y las elimina."

