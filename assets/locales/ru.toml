[apps.code]
title = "Quvyta Code"
summary = "Запускает агентов для кода в контейнерах Podman или Docker. Профиль настраивается один раз, открывается в любом вашем проекте, а между агентами и оболочками вы переходите как между вкладками."

[apps.focus]
title = "Quvyta Focus"
summary = "Учёт времени в терминале. Запустите счётчик на то, чем заняты, и посмотрите, куда ушло время, на графиках дня, недели, месяца и года."

[apps.tools]
title = "Quvyta Tools"
summary = "Одним списком применяет настройки, которые пользователи Arch Linux обычно делают вручную: зеркала, pacman, помощник для AUR, брандмауэр, SSH и не только. Каждый пункт показывает, чего коснётся, сохраняет копию и отменяется."

[apps.packages]
title = "Quvyta Packages"
summary = "Менеджер пакетов для Arch Linux, который показывает, что именно изменится, ещё до того как что-то изменится. Этот первый выпуск работает с пакетами pacman; AUR, Flatpak и Snap распознаются, но пока не управляются."

[apps.desk]
title = "Quvyta Desktop"
summary = "Рабочий стол внутри терминала: окна, док, запуск программ и файловый менеджер, сделанные для работы по SSH и на слабых машинах. Наберите qdesk на сервере и раскладывайте программы рядом мышью, не заучивая ни одного сочетания клавиш."

[apps.framework]
title = "Quvyta Framework"
summary = "Витрина фреймворка: все элементы, темы, наборы значков и языки приложений Quvyta, чтобы попробовать вживую."
library = "Сам фреймворк — библиотека на Rust: среда выполнения, элементы интерфейса, файлы тем, значков и языков, на которых стоит каждое приложение Quvyta. С ней любой может писать свои терминальные приложения."

[apps.quvyta]
title = "Quvyta"
summary = "Это приложение: показывает приложения Quvyta, устанавливает их, открывает, держит в актуальном виде и удаляет."

