[apps.code]
title = "Quvyta Code"
summary = "在 Podman 或 Docker 容器里运行编程助手。配置一次，就能在任何项目里打开它，在各个助手和 shell 之间像切换标签页一样来回走。"

[apps.focus]
title = "Quvyta Focus"
summary = "终端里的专注记录。为手头的事开一个计时器，再用日、周、月、年的图看时间都花到哪儿去了。"

[apps.tools]
title = "Quvyta Tools"
summary = "把 Arch Linux 用户平时手动做的设置集中到一张清单里：镜像源、pacman、AUR 助手、防火墙、SSH 等等。每一项都会先说明它要改什么，留好备份，并且可以撤销。"

[apps.packages]
title = "Quvyta Packages"
summary = "为 Arch Linux 写的包管理器，在动手之前把要改的东西原原本本摆出来。第一个版本管理 pacman 的软件包；AUR、Flatpak 和 Snap 能认出来，但还不归它管。"

[apps.desk]
title = "Quvyta Desktop"
summary = "跑在终端里的桌面：窗口、程序坞、启动器和文件管理器，为通过 SSH 工作和小机器而做。在服务器上敲 qdesk，就能用鼠标把程序并排打开，一个快捷键也不用记。"

[apps.framework]
title = "Quvyta Framework"
summary = "框架的展示厅：Quvyta 应用的所有组件、主题、图标集和语言，都能现场试。"
library = "框架本身是一个 Rust 库：运行时、组件，以及每个 Quvyta 应用所依托的主题、图标和语言文件。谁都可以用它写自己的终端应用。"

[apps.quvyta]
title = "Quvyta"
summary = "就是这个应用：列出 Quvyta 应用，安装它们、打开它们、保持更新，也可以卸载。"

