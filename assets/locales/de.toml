[family.code]
title = "Quvyta Code"
summary = "Führt Coding-Agenten in Podman- oder Docker-Containern aus. Ein Profil einmal einrichten, in jedem Projekt öffnen und zwischen Agenten und Shells wechseln wie zwischen Tabs."

[family.focus]
title = "Quvyta Focus"
summary = "Zeiterfassung im Terminal. Starte einen Zähler für das, woran du arbeitest, und sieh in Tages-, Wochen-, Monats- und Jahresdiagrammen, wohin deine Zeit ging."

[family.tools]
title = "Quvyta Tools"
summary = "Nimmt die Einstellungen, die Arch-Linux-Nutzer sonst von Hand vornehmen, aus einer einzigen Liste vor: Spiegelserver, pacman, ein AUR-Helfer, eine Firewall, SSH und mehr. Jeder Punkt zeigt, was er anfasst, legt eine Sicherung an und lässt sich zurücknehmen."

[family.packages]
title = "Quvyta Packages"
summary = "Eine Paketverwaltung für Arch Linux, die genau zeigt, was sich ändern wird, bevor sich etwas ändert. Diese erste Fassung verwaltet die Pakete von pacman; AUR, Flatpak und Snap werden erkannt, aber noch nicht verwaltet."

[family.desk]
title = "Quvyta Desktop"
summary = "Ein Desktop, der im Terminal läuft: Fenster, ein Dock, ein Starter und eine Dateiverwaltung, gemacht fürs Arbeiten über SSH und auf kleinen Maschinen. Tippe qdesk auf einem Server und öffne Programme mit der Maus nebeneinander, ohne einen einzigen Tastenbefehl zu lernen."

[family.framework]
title = "Quvyta Framework"
summary = "Die Schau des Frameworks: alle Bausteine, Themes, Symbolsätze und Sprachen der Familie, live zum Ausprobieren."
library = "Das Framework selbst ist eine Rust-Bibliothek: die Laufzeit, die Bausteine sowie die Theme-, Symbol- und Sprachdateien, auf denen jede Quvyta-Anwendung steht. Jeder kann damit eigene Terminal-Anwendungen bauen."

[family.quvyta]
title = "Quvyta"
summary = "Diese Anwendung: sie listet die Familie auf, installiert ihre Mitglieder, öffnet sie, hält sie aktuell und entfernt sie."

