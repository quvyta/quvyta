[apps.code]
title = "Quvyta Code"
summary = "Runs coding agents inside Podman or Docker containers. Set up a profile once, open it in any of your projects and move between agents and shells like tabs."

[apps.focus]
title = "Quvyta Focus"
summary = "Focus tracking in the terminal. Start a counter on what you work on and see where your time went in day, week, month and year charts."

[apps.tools]
title = "Quvyta Tools"
summary = "Applies the settings Arch Linux users usually set up by hand, from one list: mirrors, pacman, an AUR helper, a firewall, SSH and more. Every item shows what it will touch, keeps a backup and can be undone."

[apps.packages]
title = "Quvyta Packages"
summary = "A package manager for Arch Linux that shows exactly what will change before anything does. This first release manages pacman's packages; the AUR, Flatpak and Snap are recognised but not managed yet."

[apps.desk]
title = "Quvyta Desktop"
summary = "A desktop that runs inside the terminal: windows, a dock, a launcher and a file manager, made for working over SSH and on small machines. Type qdesk on a server and open programs side by side with the mouse, without learning a single shortcut."

[apps.framework]
title = "Quvyta Framework"
summary = "The showcase of the framework: every widget, theme, icon set and language the Quvyta apps are built with, to try out live."
library = "The framework itself is a Rust library: the runtime, the widgets, and theme, icon and language files every Quvyta application is built on. Anyone can use it to build terminal applications of their own."

[apps.quvyta]
title = "Quvyta"
summary = "This application: it lists the Quvyta apps, installs them, opens them, keeps them up to date and removes them."

